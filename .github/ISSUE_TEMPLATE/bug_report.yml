name: Bug report
description: Report unexpected MediaCheck behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping test MediaCheck. Do not upload media files or private library paths.
  - type: input
    id: version
    attributes:
      label: MediaCheck version
      placeholder: 0.15.0 Beta
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or startup
        - FFmpeg setup
        - Library scan
        - Issue review
        - Deep check
        - Duplicate detection
        - Interface or display
        - Diagnostics or support bundle
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Remove or obscure private filenames and paths.
    validations:
      required: true
  - type: input
    id: library
    attributes:
      label: Approximate library size and storage type
      placeholder: About 2,000 files across two USB drives
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional details
      description: You may attach a MediaCheck support bundle after inspecting its contents. Never attach media files.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private filenames, paths, and media from this report.
          required: true
